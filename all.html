<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All — Life List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <header class="masthead masthead--compact">
      <p class="masthead__eyebrow">A field record, kept in progress</p>
      <a class="masthead__title masthead__title--link" href="index.html">Life List</a>
      <p class="masthead__rule" aria-hidden="true"></p>
    </header>

    <main>
      <p class="not-found" id="not-found" hidden>
        That category couldn't be found. <a href="index.html">Return to the Life List</a>.
      </p>

      <section class="section" id="all-content">
        <a class="back-link" id="back-link" href="index.html">← Back to Life List</a>

        <div class="section__head">
          <h1 class="section__title" id="all-title"></h1>
          <span class="section__count" id="all-count"></span>
        </div>

        <div class="filter-bar" id="filter-bar-container">
          <!-- filter groups generated by js/all.js via js/shared.js -->
        </div>
        <button type="button" class="clear-link" id="clear-filters">Clear filters</button>

        <p class="empty-state" id="empty-state" hidden>
          No entries match that combination yet — try clearing a filter.
        </p>

        <div class="photo-grid" id="all-grid">
          <!-- cover cards generated by js/all.js -->
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Updated as new species are added to the list.</p>
    </footer>
  </div>

  <script src="js/data.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/all.js"></script>
</body>
</html>
