<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Species — Life List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <header class="masthead masthead--compact">
      <p class="masthead__eyebrow">A field record, kept in progress</p>
      <a class="masthead__title masthead__title--link" href="index.html">Life List</a>
      <p class="masthead__rule" aria-hidden="true"></p>
    </header>

    <main>
      <p class="not-found" id="not-found" hidden>
        That entry couldn't be found. <a href="index.html">Return to the Life List</a>.
      </p>

      <section class="section species-page" id="species-content">
        <a class="back-link" id="back-link" href="index.html">← Back to Life List</a>

        <div class="species-header">
          <div class="species-header__name">
            <span class="specimen__number" id="species-number"></span>
            <h1 class="species-header__title" id="species-name"></h1>
          </div>
          <p class="species-header__scientific" id="species-scientific"></p>
          <div class="specimen__tags species-header__tags" id="species-tags"></div>
        </div>

        <div class="photo-grid species-grid" id="species-grid">
          <!-- photo cards generated by js/species.js -->
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Updated as new species are added to the list.</p>
    </footer>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Enlarged photograph">
    <div class="lightbox__frame">
      <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Close">✕</button>
      <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
      <img class="lightbox__img" id="lightbox-img" src="" alt="" />
      <button type="button" class="lightbox__nav lightbox__nav--next" id="lightbox-next" aria-label="Next photo">›</button>
      <figcaption class="lightbox__caption">
        <span class="lightbox__location" id="lightbox-location"></span>
        <span class="lightbox__date" id="lightbox-date"></span>
        <p class="lightbox__notes" id="lightbox-notes"></p>
      </figcaption>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/species.js"></script>
</body>
</html>
