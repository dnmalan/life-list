name: Build data and deploy site

# Runs on every push to main (new photos, CSV edits, code changes...) and can
# also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # lets the workflow commit the regenerated js/data.js
  pages: write      # lets it publish to GitHub Pages
  id-token: write   # required by the Pages deploy action

# One deploy at a time; a newer run waits for the current one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Reads data/life-list-for-website.csv and rewrites the SPECIES block in
      # js/data.js. Fails (and stops the deploy) if the CSV has a real problem.
      - name: Generate species data from the CSV
        run: python scripts/build_data.py

      # Keep the repository's copy of data.js in sync with the CSV.
      # (A commit made here does not start another workflow run, so no loop.)
      - name: Commit regenerated data.js (only if it changed)
        run: |
          if [ -n "$(git status --porcelain js/data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add js/data.js
            git commit -m "Regenerate species data from CSV"
            git push
          else
            echo "data.js already up to date"
          fi

      - uses: actions/configure-pages@v6

      # Publish only the website itself - not the CSV, scripts, README, etc.
      # (If you add other site files at the top level, e.g. a favicon, list them here.)
      - name: Collect the public site files
        run: |
          mkdir _site
          cp index.html species.html all.html _site/
          cp -r css js images _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
