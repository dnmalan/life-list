<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life List — Birds</title>
  <meta name="description" content="A field record of birds photographed around the world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">

    <header class="masthead">
      <p class="masthead__eyebrow">A field record, kept in progress</p>
      <h1 class="masthead__title">Life List</h1>
      <p class="masthead__rule" aria-hidden="true"></p>
    </header>

    <main>
      <section class="section" aria-labelledby="birds-heading">
        <div class="section__head">
          <h2 id="birds-heading" class="section__title">Birds</h2>
          <span class="section__count" id="result-count"></span>
        </div>

        <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter photographs">
          <!-- filter stamps are generated by js/app.js from js/photos-data.js -->
        </div>
        <button type="button" class="clear-link" id="clear-filters">Clear filters</button>

        <p class="empty-state" id="empty-state" hidden>
          No entries match that combination yet — try clearing a filter.
        </p>

        <div class="photo-grid" id="photo-grid">
          <!-- photo cards are generated by js/app.js -->
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Updated as new birds are added to the list.</p>
    </footer>
  </div>

  <script src="js/photos-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
